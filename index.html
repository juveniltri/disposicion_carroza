<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carroza — Formación</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Inter:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #e9e3d0;
    --paper-deep: #ded5ba;
    --ink: #23283b;
    --ink-soft: #565c72;
    --gold: #b8923f;
    --red: #7a3030;
    --teal: #3f6659;
    --line: rgba(35,40,56,.14);
    --panel-bg: #f4f0e4;
  }

  * { box-sizing: border-box; }

  body{
    margin:0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    min-height:100vh;
  }

  header{
    padding: 2.2rem 2rem 1.2rem;
    text-align:center;
    border-bottom: 1px solid var(--line);
  }
  header h1{
    font-family:'Marcellus', serif;
    font-weight:400;
    font-size: clamp(1.8rem, 4vw, 2.6rem);
    letter-spacing: .02em;
    margin: 0 0 .3rem;
  }
  header p{
    margin:0;
    color: var(--ink-soft);
    font-size: .95rem;
    font-style: italic;
  }

  .layout{
    display:grid;
    grid-template-columns: 320px 1fr;
    gap: 0;
    align-items:start;
  }

  aside.controls{
    padding: 1.6rem 1.6rem 3rem;
    border-right: 1px solid var(--line);
    background: var(--panel-bg);
    min-height: calc(100vh - 110px);
  }

  aside.controls > p.hint{
    font-size: .82rem;
    color: var(--ink-soft);
    line-height:1.5;
    margin: 0 0 1.4rem;
  }

  fieldset{
    border: none;
    border-left: 3px solid var(--group-color, var(--gold));
    padding: .2rem 0 .2rem 1rem;
    margin: 0 0 1.6rem;
  }

  fieldset legend{
    font-family:'Marcellus', serif;
    font-size: 1.02rem;
    padding: 0;
    margin-bottom: .5rem;
    display:flex;
    align-items:center;
    gap:.5rem;
  }
  fieldset legend .sub{
    font-family:'Inter',sans-serif;
    font-size:.72rem;
    color: var(--ink-soft);
    font-style: italic;
    font-weight:400;
  }

  .field-row{
    display:flex;
    gap:.7rem;
    margin-bottom:.5rem;
  }
  .field{
    flex:1;
    display:flex;
    flex-direction:column;
    gap:.2rem;
  }
  .field label{
    font-size:.68rem;
    text-transform: none;
    color: var(--ink-soft);
  }
  .field input[type=number]{
    font-family:'Inter',sans-serif;
    font-size: .95rem;
    padding: .35rem .4rem;
    border: none;
    border-bottom: 1px solid var(--line);
    background: transparent;
    color: var(--ink);
    width:100%;
  }
  .field input[type=number]:disabled{
    color: var(--ink-soft);
    border-bottom-style: dotted;
  }
  .field input[type=number]:focus{
    outline:none;
    border-bottom: 1px solid var(--group-color, var(--gold));
  }

  .adv-toggle{
    display:flex;
    align-items:center;
    gap:.4rem;
    font-size:.75rem;
    color: var(--ink-soft);
    margin-top:.3rem;
    cursor:pointer;
    user-select:none;
  }
  .adv-toggle input{ accent-color: var(--group-color, var(--gold)); }

  .actions{
    display:flex;
    flex-direction:column;
    gap: .6rem;
    margin-top: 1.8rem;
    padding-top: 1.4rem;
    border-top: 1px solid var(--line);
  }
  button{
    font-family:'Inter', sans-serif;
    font-size: .92rem;
    padding: .7rem 1rem;
    border-radius: 3px;
    cursor:pointer;
    border: 1px solid transparent;
  }
  button.primary{
    background: var(--gold);
    color: #fff;
    border-color: var(--gold);
    font-weight:600;
  }
  button.primary:hover{ background:#a37f34; }
  button.ghost{
    background: transparent;
    border-color: var(--line);
    color: var(--ink-soft);
  }
  button.ghost:hover{ border-color: var(--ink-soft); color: var(--ink); }

  main.canvas-wrap{
    padding: 2.4rem;
    display:flex;
    justify-content:center;
    align-items:flex-start;
  }
  #diagram{
    max-width: 100%;
    height:auto;
    box-shadow: 0 10px 30px rgba(35,40,56,.14);
    background: var(--paper);
  }

  @media (max-width: 860px){
    .layout{ grid-template-columns: 1fr; }
    aside.controls{ border-right:none; border-bottom:1px solid var(--line); min-height:unset; }
  }
</style>
</head>
<body>

<header>
  <h1>Carroza</h1>
  <p>Configura la formación y exporta el diagrama para la puesta en escena</p>
</header>

<div class="layout">
  <aside class="controls" id="controls">
    <p class="hint">Ajusta el total de cada figura. Activa «modo avanzado» en cualquier grupo para fijar filas y columnas exactas en vez del total.</p>
    <div id="fieldsets"></div>
    <div class="actions">
      <button class="primary" id="exportBtn">Exportar imagen (PNG)</button>
      <button class="ghost" id="resetBtn">Restablecer valores</button>
    </div>
  </aside>

  <main class="canvas-wrap">
    <canvas id="diagram"></canvas>
  </main>
</div>

<script>
const DEFAULTS = {
  dioses:    { label:'Dioses',              note:'círculos centrales', symbol:'dot',        color:'#b8923f', total:12, cols:2, perSide:false },
  diosas:    { label:'Diosas con antorcha', note:'cuadrados laterales', symbol:'hatchSquare', color:'#7a3030', total:5,  cols:1, perSide:true  },
  guerreras: { label:'Guerreras',           note:'triángulos',          symbol:'triangle',    color:'#3f6659', total:30, cols:5, perSide:false },
  guerreros: { label:'Guerreros',           note:'círculos laterales',  symbol:'ring',        color:'#23283b', total:10, cols:2, perSide:true  }
};

let groups = {};

function resetGroups(){
  groups = {};
  for(const key in DEFAULTS){
    const d = DEFAULTS[key];
    groups[key] = { ...d, mode:'total', rows: Math.ceil(d.total / d.cols) };
  }
}
resetGroups();

const fieldsetsEl = document.getElementById('fieldsets');

function buildControls(){
  fieldsetsEl.innerHTML = '';
  for(const key in groups){
    const g = groups[key];
    const wrap = document.createElement('fieldset');
    wrap.style.setProperty('--group-color', g.color);
    wrap.innerHTML = `
      <legend>${g.label} <span class="sub">· ${g.note}${g.perSide ? ' (por lado)' : ''}</span></legend>
      <div class="field-row">
        <div class="field">
          <label>Total</label>
          <input type="number" min="0" data-key="${key}" data-role="total" value="${g.total}">
        </div>
        <div class="field">
          <label>Columnas</label>
          <input type="number" min="1" data-key="${key}" data-role="cols" value="${g.cols}">
        </div>
        <div class="field">
          <label>Filas</label>
          <input type="number" min="1" data-key="${key}" data-role="rows" value="${g.rows}" disabled>
        </div>
      </div>
      <label class="adv-toggle">
        <input type="checkbox" data-key="${key}" data-role="adv">
        Modo avanzado (fijar filas y columnas)
      </label>
    `;
    fieldsetsEl.appendChild(wrap);
  }

  fieldsetsEl.querySelectorAll('input').forEach(input=>{
    input.addEventListener('input', onInputChange);
    input.addEventListener('change', onInputChange);
  });
}

function onInputChange(e){
  const key = e.target.dataset.key;
  const role = e.target.dataset.role;
  const g = groups[key];

  if(role === 'adv'){
    g.mode = e.target.checked ? 'advanced' : 'total';
  } else if(role === 'total'){
    g.total = Math.max(0, parseInt(e.target.value) || 0);
  } else if(role === 'cols'){
    g.cols = Math.max(1, parseInt(e.target.value) || 1);
  } else if(role === 'rows'){
    g.rows = Math.max(1, parseInt(e.target.value) || 1);
  }

  recompute(key);
  syncFieldset(key);
  draw();
}

function recompute(key){
  const g = groups[key];
  if(g.mode === 'total'){
    g.rows = Math.max(1, Math.ceil(g.total / g.cols));
  } else {
    g.total = g.rows * g.cols;
  }
}

function syncFieldset(key){
  const g = groups[key];
  const scope = fieldsetsEl.querySelector(`[data-key="${key}"][data-role="total"]`).closest('fieldset');
  const totalInput = scope.querySelector('[data-role="total"]');
  const colsInput  = scope.querySelector('[data-role="cols"]');
  const rowsInput  = scope.querySelector('[data-role="rows"]');

  if(g.mode === 'advanced'){
    totalInput.value = g.total;
    totalInput.disabled = true;
    rowsInput.disabled = false;
    rowsInput.value = g.rows;
  } else {
    totalInput.disabled = false;
    if(document.activeElement !== totalInput) totalInput.value = g.total;
    rowsInput.disabled = true;
    rowsInput.value = g.rows;
  }
  if(document.activeElement !== colsInput) colsInput.value = g.cols;
}

function syncAllFieldsets(){
  for(const key in groups) syncFieldset(key);
}

/* ---------- Drawing ---------- */

const canvas = document.getElementById('diagram');
const ctx = canvas.getContext('2d');
const CELL = 34;
const BLOCK_GAP = 44;
const EXPORT_SCALE = 2;

function drawSymbol(ctx, type, cx, cy, color){
  ctx.save();
  ctx.strokeStyle = color;
  ctx.fillStyle = color;
  ctx.lineWidth = 2;

  if(type === 'dot'){
    ctx.beginPath();
    ctx.ellipse(cx, cy, 7, 8, 0, 0, Math.PI*2);
    ctx.fill();
  } else if(type === 'hatchSquare'){
    const s = 15;
    ctx.beginPath();
    ctx.rect(cx-s/2, cy-s/2, s, s);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.55)';
    ctx.lineWidth = 1.4;
    ctx.save();
    ctx.beginPath();
    ctx.rect(cx-s/2, cy-s/2, s, s);
    ctx.clip();
    for(let o=-s; o<=s; o+=5){
      ctx.beginPath();
      ctx.moveTo(cx-s/2+o, cy-s/2);
      ctx.lineTo(cx-s/2+o+s, cy+s/2);
      ctx.stroke();
    }
    ctx.restore();
  } else if(type === 'triangle'){
    const r = 11;
    ctx.beginPath();
    ctx.moveTo(cx, cy-r);
    ctx.lineTo(cx-r*0.95, cy+r*0.8);
    ctx.lineTo(cx+r*0.95, cy+r*0.8);
    ctx.closePath();
    ctx.lineWidth = 2.2;
    ctx.stroke();
  } else if(type === 'ring'){
    ctx.beginPath();
    ctx.ellipse(cx, cy, 10, 11, 0, 0, Math.PI*2);
    ctx.lineWidth = 2.2;
    ctx.stroke();
  }
  ctx.restore();
}

function drawBlock(ctx, x, y, cols, rows, symbol, color){
  for(let r=0; r<rows; r++){
    for(let c=0; c<cols; c++){
      const cx = x + c*CELL + CELL/2;
      const cy = y + r*CELL + CELL/2;
      drawSymbol(ctx, symbol, cx, cy, color);
    }
  }
}

function blockDims(g){
  return { w: g.cols*CELL, h: g.rows*CELL };
}

function draw(){
  const g = groups;
  const dDiosas = blockDims(g.diosas);
  const dDioses = blockDims(g.dioses);
  const dGuerreros = blockDims(g.guerreros);
  const dGuerreras = blockDims(g.guerreras);

  const topRowW = dDiosas.w + BLOCK_GAP + dDioses.w + BLOCK_GAP + dDiosas.w;
  const bottomRowW = dGuerreros.w + BLOCK_GAP + dGuerreras.w + BLOCK_GAP + dGuerreros.w;

  const margin = 56;
  const titleH = 54;
  const topH = Math.max(dDiosas.h, dDioses.h);
  const dividerSpace = 46;
  const bottomH = Math.max(dGuerreros.h, dGuerreras.h);
  const legendGap = 46;

  const legendEntries = Object.values(g);
  const legendHeaderH = 34;
  const legendRowH = 30;
  const legendH = legendHeaderH + legendEntries.length * legendRowH;

  const contentW = Math.max(topRowW, bottomRowW) + margin*2;
  const contentH = margin + titleH + topH + dividerSpace + bottomH + legendGap + legendH + margin;

  canvas.width = contentW * EXPORT_SCALE;
  canvas.height = contentH * EXPORT_SCALE;
  canvas.style.width = contentW + 'px';
  canvas.style.height = contentH + 'px';
  ctx.setTransform(EXPORT_SCALE, 0, 0, EXPORT_SCALE, 0, 0);

  // background
  ctx.fillStyle = '#e9e3d0';
  ctx.fillRect(0, 0, contentW, contentH);

  // faint graph-paper grid
  ctx.strokeStyle = 'rgba(35,40,56,.06)';
  ctx.lineWidth = 1;
  for(let gx=0; gx<contentW; gx+=17){
    ctx.beginPath(); ctx.moveTo(gx,0); ctx.lineTo(gx,contentH); ctx.stroke();
  }
  for(let gy=0; gy<contentH; gy+=17){
    ctx.beginPath(); ctx.moveTo(0,gy); ctx.lineTo(contentW,gy); ctx.stroke();
  }

  // title
  ctx.fillStyle = '#23283b';
  ctx.textAlign = 'center';
  ctx.font = '400 30px Marcellus, serif';
  ctx.fillText('Carroza', contentW/2, margin + 30);
  ctx.font = 'italic 13px Inter, sans-serif';
  ctx.fillStyle = '#565c72';
  ctx.fillText('Formación de puesta en escena', contentW/2, margin + 48);

  // top row
  const topY = margin + titleH;
  let x = (contentW - topRowW) / 2;

  const diosasLeftY = topY + (topH - dDiosas.h)/2;
  drawBlock(ctx, x, diosasLeftY, g.diosas.cols, g.diosas.rows, g.diosas.symbol, g.diosas.color);
  x += dDiosas.w + BLOCK_GAP;

  const diosesY = topY + (topH - dDioses.h)/2;
  drawBlock(ctx, x, diosesY, g.dioses.cols, g.dioses.rows, g.dioses.symbol, g.dioses.color);
  x += dDioses.w + BLOCK_GAP;

  const diosasRightY = topY + (topH - dDiosas.h)/2;
  drawBlock(ctx, x, diosasRightY, g.diosas.cols, g.diosas.rows, g.diosas.symbol, g.diosas.color);

  // divider
  const dividerY = topY + topH + dividerSpace/2;
  ctx.strokeStyle = '#b8923f';
  ctx.lineWidth = 1.6;
  ctx.beginPath();
  ctx.moveTo(margin, dividerY);
  ctx.lineTo(contentW - margin, dividerY);
  ctx.stroke();

  // bottom row
  const bottomY = topY + topH + dividerSpace;
  x = (contentW - bottomRowW) / 2;

  const guerrerosLeftY = bottomY + (bottomH - dGuerreros.h)/2;
  drawBlock(ctx, x, guerrerosLeftY, g.guerreros.cols, g.guerreros.rows, g.guerreros.symbol, g.guerreros.color);
  x += dGuerreros.w + BLOCK_GAP;

  const guerrerasY = bottomY + (bottomH - dGuerreras.h)/2;
  drawBlock(ctx, x, guerrerasY, g.guerreras.cols, g.guerreras.rows, g.guerreras.symbol, g.guerreras.color);
  x += dGuerreras.w + BLOCK_GAP;

  const guerrerosRightY = bottomY + (bottomH - dGuerreros.h)/2;
  drawBlock(ctx, x, guerrerosRightY, g.guerreros.cols, g.guerreros.rows, g.guerreros.symbol, g.guerreros.color);

  // legend
  const legendY = bottomY + bottomH + legendGap;
  ctx.textAlign = 'left';
  ctx.fillStyle = '#23283b';
  ctx.font = '400 19px Marcellus, serif';
  ctx.fillText('Glosario', margin, legendY);

  const order = ['dioses','diosas','guerreras','guerreros'];
  order.forEach((key, i)=>{
    const gr = g[key];
    const rowY = legendY + legendHeaderH + i*legendRowH;
    drawSymbol(ctx, gr.symbol, margin + 10, rowY - 5, gr.color);
    const countText = gr.perSide ? `${gr.total} por lado — ${gr.total*2} en total` : `${gr.total} en total`;
    ctx.font = '600 14px Inter, sans-serif';
    ctx.fillStyle = '#23283b';
    ctx.fillText(`${gr.label}`, margin + 34, rowY);
    ctx.font = '400 13px Inter, sans-serif';
    ctx.fillStyle = '#565c72';
    const labelWidth = ctx.measureText(gr.label).width;
    ctx.font = '600 14px Inter, sans-serif';
    const nameWidth = ctx.measureText(gr.label).width;
    ctx.font = '400 13px Inter, sans-serif';
    ctx.fillText(`  ·  ${gr.note}  —  ${countText}`, margin + 34 + nameWidth, rowY);
  });
}

/* ---------- Export ---------- */

document.getElementById('exportBtn').addEventListener('click', ()=>{
  draw();
  const link = document.createElement('a');
  link.download = 'carroza-formacion.png';
  link.href = canvas.toDataURL('image/png');
  link.click();
});

document.getElementById('resetBtn').addEventListener('click', ()=>{
  resetGroups();
  buildControls();
  syncAllFieldsets();
  draw();
});

/* ---------- Init ---------- */

document.fonts.ready.then(()=>{
  buildControls();
  syncAllFieldsets();
  draw();
});
</script>

</body>
</html>
